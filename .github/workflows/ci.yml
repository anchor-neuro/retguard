name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[ui]" -r requirements-lock.txt
      - name: Generate gradio type stubs
        # gradio writes its component .pyi stubs on first import; the wheel
        # ships none, so mypy needs one import to see event methods.
        run: python -c "import gradio"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy --strict retguard
      - name: Unit tests
        run: pytest -m "not requires_weights"
